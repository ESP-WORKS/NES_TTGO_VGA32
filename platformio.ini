; NES TTGO VGA32 v1.03 (v1.02 + bordas suavizadas F5, padrao desligado + correcoes de CPU/IRQ) - base v0.10 validada para flicker e bege / Nofrendo (NES.zip) / menus SMS v0.1.43 / particoes MC-1000 v0.92
[platformio]
default_envs = ttgo-vga32

[env:ttgo-vga32]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
board_upload.maximum_size = 2883584
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DNOLOOP=1
    -DNES_VISIBLE_HEIGHT=240
    -DNES_VIDEO_240=1
    -Isrc/nes_core
    -DCORE_DEBUG_LEVEL=0
    -DNES_BATTERY_AUTOSAVE_IN_GAME=0
    ; Diagnostico estabilidade: evite escrita SD durante jogo.
    ; Saves continuam no menu F1, troca de ROM e retorno ao MultiLoader.
    ; Para reativar autosave a cada 20s apos validar estabilidade, troque 0 por 1.
    -O2
    -DNES_IRAM_HOT=1
    ; v0.1.9: linhas VGA via anel em RAM interna + tarefa no core 0 (tecnica
    ; SMS v0.1.34). Se aparecer cintilacao/linhas erradas, troque 1 por 0.
    -DSMS_VGA_LINE_RING=1
    ; v0.1.10: PPU (fundo + sprites + conversao VGA) desenhada no core 0; o
    ; core 1 fica com 6502/APU. 0 = volta ao renderizador v0.1.9 (um core).
    -DNES_PPU_ASYNC=1
    ; v0.1.12: linhas do jogo gravadas direto no buffer exibido, atras do
    ; feixe (sem stage PSRAM nem copia stage->DMA). Se houver linha de rasgo
    ; fixa na imagem, troque 1 por 0 (volta ao video da v0.1.10).
    -DNES_VGA_DIRECT=1
    ; v0.1.15: 96 linhas + OSD (sem worker PSRAM na faixa superior).
    ; 24 KiB DRAM + margem OSD de 512 B, copia somente no VBlank.
    ; 0 desativa a banda protegida (somente para diagnostico).
    -DNES_VGA_DIRECT_TOP_ROWS=96
    ; v0.8: stage central 96..143 usando RAM PSRAM JA EXISTENTE;
    ; apresentação atômica junto do topo no VBlank. 0 = v0.1.17.
    -DNES_VGA_DIRECT_MIDDLE_ROWS=144
    -DNES_VGA_COHERENT_COMMIT=1
    ; v1.01: SEM mascaras de overscan. Todo o quadro NES 256x240 aparece.
    ; F4 mostra os 256 pixels por linha e todas as 240 linhas.
    ; O modo 320x240 centralizado conserva apenas suas margens naturais.
    -DNES_VGA_OVERSCAN_SIDE=0
    -DNES_VGA_OVERSCAN_BOTTOM=0
    ; v1.03: bordas suavizadas, sem recorte: 4 px/linhas externos de cada borda
    ; a 30% do brilho. F5 liga/desliga no jogo; inicia DESLIGADO (0).
    -DNES_VGA_EDGE_SOFT=0
    -DNES_VGA_EDGE_PCT=30
    -DNES_PALETTE_NTSC_2C02=1
    ; Ajuste perceptual apenas para os vermelhos 2C02 $16 e $26.
    -DNES_RED_HUE_RGB222=1
    ; v0.1.17: correct NES 2C02 teal/cyan $1C,$2C without changing other colors.
    -DNES_CYAN_HUE_RGB222=1
    ; v0.10: RGB222 uniform per pixel (sem quadriculado/beige dithering).
    ; O presenter aguarda o EOF, publica topo e as outras linhas do mesmo
    ; quadro antes do feixe (copy-ahead) para eliminar flicker vertical.
    ; Para comparar a antiga implementacao: ajuste COHERENT_COMMIT=0 e
    ; DIRECT_MIDDLE_ROWS=48 (v0.9 experimental).
    ; Release: avoid 115200 baud telemetry every 10 seconds during gameplay.
    ; Set to 1 only to diagnose timing, resets, memory or TOP_MISSED.
    -DNES_DIAG_SERIAL=0
    ; SMS v0.1.43: selectively relocate hot PPU code to instruction RAM.
    ; For exact A/B performance tests, change 1 to 0 (if needed).
    -DNES_AUDIO_SAMPLE_RATE=15720
lib_deps =
    fdivitto/FabGL@1.0.9
lib_ldf_mode = deep+
monitor_speed = 115200
; NAO use Upload: preserva a particao factory (MultiLoader).
upload_protocol = custom
upload_command = python "$PROJECT_DIR/tools/bloquear_upload.py"
